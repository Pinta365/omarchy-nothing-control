name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The validator is a self-contained script; pin it so upstream cannot change
  # what this repo is checked against without a commit here.
  OMARCHY_REF: v4.0.4

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stdlib only, and the helper only touches Bluetooth inside a session,
      # so a runner with no adapter runs these fine.
      - name: Protocol tests
        run: python3 -m unittest discover -s tests -v

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Model tests
        run: deno test --allow-read tests/model_test.ts

      - name: Shell syntax
        run: |
          for script in tools/*.sh; do
            bash -n "$script"
          done

      - name: Shell lint
        run: shellcheck tools/*.sh

      - name: Plugin manifest
        run: |
          curl -fsSL -o /tmp/omarchy-plugin-validate \
            "https://raw.githubusercontent.com/basecamp/omarchy/${OMARCHY_REF}/bin/omarchy-plugin-validate"
          bash /tmp/omarchy-plugin-validate .

  # Arch rather than Ubuntu: Ubuntu's Qt is far older than what Omarchy runs,
  # and its qmllint fails on warnings the current one only reports. Omarchy's
  # own imports cannot resolve here either way; syntax errors still fail.
  qml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: QML lint
        run: |
          pacman -Syu --noconfirm --needed qt6-declarative
          /usr/lib/qt6/bin/qmllint --version
          /usr/lib/qt6/bin/qmllint Panel.qml Service.qml NothingEarIcon.qml
